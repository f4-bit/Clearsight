services:
  ml-redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - clearsight
    volumes:
      - clearsight-ml-redis:/data

  ml-service:
    build:
      context: ..
      dockerfile: docker/ml-service.Dockerfile
    restart: unless-stopped
    env_file:
      - ml-service.env
    environment:
      ML_REDIS_URL: redis://ml-redis:6379/0
      ML_MODEL_CACHE_DIR: /models
      ML_MANIFEST_PATH: /app/ml/models/manifest.json
      ML_DEVICE: cpu
    ports:
      - "8000:8000"
    volumes:
      - clearsight-ml-models:/models
    depends_on:
      ml-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - clearsight

networks:
  clearsight:
    external: true
    name: clearsight

volumes:
  clearsight-ml-models:
  clearsight-ml-redis:
