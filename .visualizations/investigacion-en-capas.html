<div id="clearsight-capas" lang="es">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');

    #clearsight-capas {
      --surface: #0a151d;
      --petrol: #142b35;
      --ink: #eef6f7;
      --muted: #acbec3;
      --cyan: #b9e7ee;
      --cyan-ink: #10282e;
      --divider: #263e47;
      --text: 'Space Grotesk', system-ui, sans-serif;
      --mono: 'Cascadia Mono', Consolas, monospace;
      color-scheme: dark;
      color: var(--ink);
      font: 15px/1.45 var(--text);
      background: var(--surface);
      overflow: hidden;
      isolation: isolate;
      container-type: inline-size;
    }

    #clearsight-capas *, #clearsight-capas *::before, #clearsight-capas *::after { box-sizing: border-box; }
    #clearsight-capas h1, #clearsight-capas h2, #clearsight-capas p, #clearsight-capas figure { margin: 0; }
    #clearsight-capas button, #clearsight-capas input { font: inherit; }
    #clearsight-capas button { cursor: pointer; }
    #clearsight-capas :is(button, input):focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
    #clearsight-capas .cs-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
      min-height: 52px;
      padding: .5rem 1.25rem;
      border-bottom: 1px solid #1c1c22;
      background: #0e0e11;
    }
    #clearsight-capas .cs-brand {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: .25rem 1rem;
    }
    #clearsight-capas .cs-wordmark { color: white; font-size: 16px; font-weight: 700; letter-spacing: -.025em; }
    #clearsight-capas .cs-page-name { color: #a1a1a9; font-size: 14px; font-weight: 500; }
    #clearsight-capas .cs-session { position: relative; z-index: 3; }
    #clearsight-capas .cs-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .55rem;
      min-height: 39px;
      padding: 0 .8rem;
      border: 1px solid #6b909b;
      border-radius: 5px;
      color: var(--ink);
      background: #101f28;
      white-space: nowrap;
      font-weight: 600;
      font-size: 13px;
    }
    #clearsight-capas .cs-button:hover { border-color: var(--cyan); background: #203b46; }
    #clearsight-capas .cs-session .cs-button {
      min-height: 34px;
      padding: .5rem .75rem;
      border-color: #222228;
      border-radius: 4px;
      color: #ededef;
      background: #111114;
      font-size: 12px;
      font-weight: 500;
      line-height: 1rem;
    }
    #clearsight-capas .cs-session .cs-button:hover { background: #141418; }
    #clearsight-capas .cs-field {
      display: block;
      min-width: 0;
      width: 100%;
      min-height: 39px;
      padding: .55rem .65rem;
      border: 1px solid #547782;
      border-radius: 5px;
      color: var(--ink);
      background: #0b1a23;
      font: 13px var(--mono);
    }
    #clearsight-capas .cs-field::placeholder { color: #b4c6cc; opacity: 1; }
    #clearsight-capas .cs-stage {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 47fr) minmax(0, 53fr);
      align-items: center;
      min-height: clamp(415px, 43cqi, 655px);
      gap: max(12px, 2cqi);
      padding: 28px max(23px, 4.4cqi) 40px;
      background: radial-gradient(ellipse at 77% 54%, #183c47 0%, #102530 28%, transparent 62%);
    }
    #clearsight-capas .cs-lookup { position: relative; z-index: 2; min-width: 0; }
    #clearsight-capas h1 { max-inline-size: 17ch; font-size: clamp(35px, 5.1cqi, 68px); letter-spacing: -.06em; line-height: 1.04; font-weight: 650; text-wrap: balance; }
    #clearsight-capas h2 { font-size: clamp(20px, 2.35cqi, 34px); line-height: 1.11; letter-spacing: -.043em; font-weight: 650; }
    #clearsight-capas .cs-subtitle { margin-top: .55rem; color: var(--muted); font-size: 14px; }
    #clearsight-capas .cs-lookup form { margin-top: 1.55rem; }
    #clearsight-capas .cs-label, #clearsight-capas legend { display: block; padding: 0; margin: 0 0 .35rem; color: #e3f0f2; font-size: 12px; font-weight: 500; }
    #clearsight-capas .cs-command { display: grid; grid-template-columns: minmax(0, 1fr) auto; }
    #clearsight-capas .cs-command .cs-field { border-radius: 5px 0 0 5px; }
    #clearsight-capas .cs-command .cs-button { border-color: var(--cyan); border-radius: 0 5px 5px 0; background: var(--cyan); color: var(--cyan-ink); }
    #clearsight-capas .cs-command .cs-button:hover { background: #d4f5fa; }
    #clearsight-capas .cs-feedback { min-height: 19px; margin-top: .4rem; font-size: 12px; color: var(--muted); }
    #clearsight-capas .cs-session .cs-feedback { position: absolute; top: 100%; right: .85rem; z-index: 3; white-space: nowrap; }

    #clearsight-capas .cs-example { position: relative; min-width: 0; align-self: stretch; display: flex; flex-direction: column; justify-content: center; }
    #clearsight-capas .cs-example figcaption { color: var(--muted); font-size: 13px; }
    #clearsight-capas .cs-layer-controls { display: flex; gap: clamp(.6rem, 1.6cqi, 1.3rem); }
    #clearsight-capas .cs-layer-controls button {
      padding: .35rem .1rem .48rem;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: #bfd1d9;
      font-size: 13px;
      text-align: start;
      transition: border-color 170ms ease, color 170ms ease;
    }
    #clearsight-capas .cs-layer-controls button:hover { color: var(--ink); }
    #clearsight-capas .cs-layer-controls button[aria-pressed=true] { border-bottom-color: var(--cyan); color: var(--ink); }
    #clearsight-capas .cs-scene { position: relative; height: clamp(225px, 30cqi, 470px); min-width: 0; perspective: 950px; }
    #clearsight-capas .cs-scene::before {
      position: absolute;
      z-index: -1;
      inset: 14% -3% 12% 3%;
      background: radial-gradient(ellipse, #44768455 0%, #28545f2b 40%, transparent 69%);
      content: '';
    }
    #clearsight-capas .cs-registration {
      position: absolute;
      top: 53%;
      right: 2%;
      left: 3%;
      border-top: 1px dashed #6b919b;
      opacity: .45;
      pointer-events: none;
    }
    #clearsight-capas .cs-plane {
      --raise: 0px;
      --slide: 0px;
      --lift: 0px;
      position: absolute;
      top: 12%;
      left: var(--left);
      width: 38%;
      height: 76%;
      display: grid;
      place-items: center;
      border: 1px solid #6c939e9e;
      border-radius: 5px;
      background: linear-gradient(155deg, #3f667056, #10232fac 76%);
      box-shadow: 10px 18px 40px #0311176b, inset 0 1px #c3e8ec21;
      transform: translate3d(calc(var(--pointer-x, 0px) * var(--depth) + var(--slide)), calc(var(--pointer-y, 0px) * var(--depth) + var(--raise)), var(--lift)) rotateY(-25deg) rotateX(7deg) rotateZ(-3deg);
      transition: transform 370ms cubic-bezier(.2,.8,.25,1), border-color 260ms ease, filter 270ms ease;
      filter: brightness(.77);
    }
    #clearsight-capas .cs-plane::after { position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: linear-gradient(90deg, #a9d6db 0 5%, transparent 5% 95%, #a9d6db 95%); pointer-events: none; content: ''; }
    #clearsight-capas .cs-plane[data-plane=retina] { --left: 3%; --depth: 1; z-index: 3; background: linear-gradient(155deg, #33535e, #101f27 75%); filter: brightness(.91); }
    #clearsight-capas .cs-plane[data-plane=segmentation] { --left: 34%; --depth: .72; z-index: 2; }
    #clearsight-capas .cs-plane[data-plane=data] { --left: 63%; --depth: .42; z-index: 1; }
    #clearsight-capas .cs-plane.is-active { --raise: -9px; --lift: 30px; border-color: #b9e7eec4; filter: brightness(1.1); }
    #clearsight-capas .cs-plane[data-plane=data].is-active { --slide: 7px; }
    #clearsight-capas .cs-fundus { display: block; width: 91%; height: auto; aspect-ratio: 1; opacity: .94; object-fit: cover; border-radius: 50%; filter: saturate(.9); }
    #clearsight-capas .cs-contours { width: 68%; max-height: 69%; margin-left: 13%; color: #d2f1f4; overflow: visible; }
    #clearsight-capas .cs-sample-table { display: grid; margin-left: 15%; width: 69%; gap: .65rem; color: #c8e0e5; font: 11px/1 var(--mono); }
    #clearsight-capas .cs-sample-table span { display: block; padding-bottom: .35rem; border-bottom: 1px solid #80abb080; }

    #clearsight-capas .cs-export {
      position: relative;
      display: grid;
      grid-template-columns: minmax(180px, 1.13fr) minmax(0, 2.7fr);
      align-items: center;
      gap: clamp(15px, 2.7cqi, 29px);
      padding: clamp(25px, 3.15cqi, 48px) max(23px, 4.4cqi) clamp(17px, 2.15cqi, 30px);
      background: #132630;
      border-top: 1px solid var(--divider);
    }
    #clearsight-capas .cs-connector {
      position: absolute;
      right: 15%;
      bottom: 0;
      width: 20%;
      height: clamp(74px, 7.7cqi, 122px);
      border: 1px solid #537983;
      border-top: 0;
      border-left: 0;
      border-radius: 0 0 8px 0;
      transform: translateY(-1px);
      pointer-events: none;
      transition: border-color 280ms ease;
    }
    #clearsight-capas .cs-connector::after { content: ''; position: absolute; bottom: -4px; left: 0; width: 7px; aspect-ratio: 1; border-radius: 50%; background: #6babb7; transition: background 280ms ease, box-shadow 280ms ease; }
    #clearsight-capas[data-layer=data] .cs-connector { border-color: #a8dce5; }
    #clearsight-capas[data-layer=data] .cs-connector::after { background: var(--cyan); box-shadow: 0 0 10px #a9dfea55; }
    #clearsight-capas .cs-export-copy, #clearsight-capas .cs-export form { position: relative; min-width: 0; }
    #clearsight-capas .cs-export-copy { padding-right: .8rem; border-right: 1px solid var(--divider); }
    #clearsight-capas .cs-export .cs-subtitle { line-height: 1.3; }
    #clearsight-capas .cs-export-fields { display: grid; grid-template-columns: 1fr 1.2fr .85fr auto; gap: clamp(8px, 1.15cqi, 15px); align-items: end; }
    #clearsight-capas .cs-export-fields > * { min-width: 0; }
    #clearsight-capas .cs-export :is(.cs-field, .cs-button) { border-radius: 4px; }
    #clearsight-capas .cs-download { border-color: #486775; background: #142b35; }
    #clearsight-capas fieldset { min-inline-size: 0; border: 0; padding: 0; margin: 0; }
    #clearsight-capas .cs-formats { display: flex; width: fit-content; max-width: 100%; border: 1px solid #547782; border-radius: 4px; background: #0b1a23; }
    #clearsight-capas .cs-formats label { position: relative; cursor: pointer; }
    #clearsight-capas .cs-formats label + label { border-left: 1px solid #547782; }
    #clearsight-capas .cs-formats input { position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; margin: 0; opacity: 0; pointer-events: none; }
    #clearsight-capas .cs-formats span { display: grid; place-items: center; min-height: 37px; min-width: 38px; padding: 0 .4rem; border-radius: 3px; font: 600 12px var(--text); }
    #clearsight-capas .cs-formats input:checked + span { color: var(--cyan-ink); background: var(--cyan); }
    #clearsight-capas .cs-formats input:focus-visible + span { outline: 2px solid var(--cyan); outline-offset: 3px; }

    @container (max-width: 830px) {
      #clearsight-capas .cs-export { grid-template-columns: minmax(156px, .96fr) minmax(0, 2.15fr); }
      #clearsight-capas .cs-export-fields { grid-template-columns: 1fr 1.15fr .9fr; }
      #clearsight-capas .cs-export-fields > button { grid-column: 1 / -1; justify-self: end; }
    }
    @container (max-width: 660px) {
      #clearsight-capas .cs-stage { grid-template-columns: minmax(0, 1fr); min-height: auto; padding-top: 26px; padding-bottom: 33px; }
      #clearsight-capas .cs-example { width: 100%; max-width: 460px; justify-self: center; margin-top: .45rem; }
      #clearsight-capas .cs-lookup form { margin-top: .95rem; }
      #clearsight-capas .cs-scene { height: clamp(187px, 49cqi, 265px); }
      #clearsight-capas .cs-connector { height: 46px; right: 21%; width: 29%; }
      #clearsight-capas .cs-export { grid-template-columns: minmax(0, 1fr); gap: .8rem; }
      #clearsight-capas .cs-export-copy { border-right: 0; padding-right: 0; }
    }
    @container (max-width: 395px) {
      #clearsight-capas .cs-header { padding-inline: .75rem; gap: .5rem; }
      #clearsight-capas .cs-brand { column-gap: .7rem; }
      #clearsight-capas .cs-export-fields { grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); }
      #clearsight-capas .cs-export-fields > button { grid-column: auto; justify-self: stretch; }
      #clearsight-capas .cs-command .cs-button { padding-inline: .55rem; }
      #clearsight-capas .cs-command .cs-field { padding-inline: .4rem; }
    }
    @media (pointer: coarse) {
      #clearsight-capas :is(.cs-button, .cs-field, .cs-layer-controls button) { min-height: 44px; }
      #clearsight-capas .cs-formats span { min-height: 42px; min-width: 42px; }
      #clearsight-capas .cs-field { font-size: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      #clearsight-capas * { transition: none !important; }
    }
  </style>

  <header class="cs-header">
    <div class="cs-brand">
      <span class="cs-wordmark">ClearSight</span>
      <span class="cs-page-name">Investigación</span>
    </div>
    <div class="cs-session">
      <button class="cs-button cs-logout" type="button">Cerrar sesión</button>
      <p class="cs-feedback" role="status"></p>
    </div>
  </header>

  <div class="cs-stage">
    <section class="cs-lookup" aria-labelledby="cs-capas-title">
      <h1 id="cs-capas-title">Consultar análisis por ojo</h1>
      <p class="cs-subtitle">Usa el ID de una ejecución autorizada.</p>
      <form>
        <label class="cs-label" for="cs-capas-execution">ID de ejecución</label>
        <div class="cs-command">
          <input class="cs-field" id="cs-capas-execution" name="execution" placeholder="Pega el UUID completo" autocomplete="off" spellcheck="false" required>
          <button class="cs-button" type="submit">Abrir análisis <i data-lucide="arrow-right" aria-hidden="true"></i></button>
        </div>
        <p class="cs-feedback" role="status"></p>
      </form>
    </section>

    <figure class="cs-example" aria-labelledby="cs-capas-example">
      <figcaption id="cs-capas-example">Ejemplo de análisis</figcaption>
      <div class="cs-layer-controls" role="group" aria-label="Capas del análisis de ejemplo">
        <button type="button" data-layer="retina" aria-pressed="false">Retinografía</button>
        <button type="button" data-layer="segmentation" aria-pressed="true">Segmentación</button>
        <button type="button" data-layer="data" aria-pressed="false">Datos</button>
      </div>

  <section class="cs-export" aria-labelledby="cs-capas-export">
    <div class="cs-export-copy">
      <h2 id="cs-capas-export">Exportar referencias validadas</h2>
      <p class="cs-subtitle">Descarga datos pseudonimizados.</p>
    </div>
    <form>
      <div class="cs-export-fields">
        <fieldset>
          <legend>Formato</legend>
          <div class="cs-formats">
            <label><input name="format" type="radio" value="CSV" checked><span>CSV</span></label>
            <label><input name="format" type="radio" value="JSON"><span>JSON</span></label>
          </div>
        </fieldset>
        <div>
          <label class="cs-label" for="cs-capas-date">Desde (opcional)</label>
          <input class="cs-field" id="cs-capas-date" name="since" type="date">
        </div>
        <div>
          <label class="cs-label" for="cs-capas-limit">Límite de registros</label>
          <input class="cs-field" id="cs-capas-limit" name="limit" type="number" min="1" max="5000" placeholder="5000">
        </div>
        <button class="cs-button cs-download" type="submit"><i data-lucide="download" aria-hidden="true"></i><span>Descargar CSV</span></button>
      </div>
      <p class="cs-feedback" role="status"></p>
    </form>
  </section>

  <script>
    (() => {
      const root = document.getElementById('clearsight-capas');
      const layerButtons = root.querySelectorAll('.cs-layer-controls button');
      const planes = root.querySelectorAll('[data-plane]');
      const stage = root.querySelector('.cs-stage');
      const scene = root.querySelector('.cs-scene');
      const lookup = root.querySelector('.cs-lookup form');
      const exportForm = root.querySelector('.cs-export form');
      const downloadLabel = root.querySelector('.cs-download span');
      const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');

      function selectLayer(layer) {
        root.dataset.layer = layer;
        layerButtons.forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.layer === layer)));
        planes.forEach((plane) => plane.classList.toggle('is-active', plane.dataset.plane === layer));
      }

      function resetPerspective() {
        scene.style.removeProperty('--pointer-x');
        scene.style.removeProperty('--pointer-y');
      }

      stage.addEventListener('pointermove', (event) => {
        if (motionPreference.matches || event.pointerType !== 'mouse') return;
        const bounds = stage.getBoundingClientRect();
        const horizontal = (event.clientX - bounds.left) / bounds.width - .5;
        const vertical = (event.clientY - bounds.top) / bounds.height - .5;
        scene.style.setProperty('--pointer-x', String(horizontal * 19) + 'px');
        scene.style.setProperty('--pointer-y', String(vertical * 13) + 'px');
      });
      stage.addEventListener('pointerleave', resetPerspective);
      motionPreference.addEventListener('change', resetPerspective);

      layerButtons.forEach((button) => button.addEventListener('click', () => selectLayer(button.dataset.layer)));
      lookup.addEventListener('focusin', () => selectLayer('retina'));
      exportForm.addEventListener('focusin', () => selectLayer('data'));
      lookup.addEventListener('submit', (event) => {
        event.preventDefault();
        const execution = String(new FormData(lookup).get('execution')).trim();
        const valid = /^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$/i.test(execution);
        lookup.querySelector('[role=status]').textContent = valid
          ? 'ID válido. La consulta se realiza en ClearSight.'
          : 'Introduce un UUID completo para continuar.';
        if (valid) selectLayer('segmentation');
      });
      exportForm.addEventListener('change', () => {
        const format = new FormData(exportForm).get('format');
        downloadLabel.textContent = 'Descargar ' + format;
        exportForm.querySelector('[role=status]').textContent = '';
      });
      exportForm.addEventListener('submit', (event) => {
        event.preventDefault();
        const format = new FormData(exportForm).get('format');
        exportForm.querySelector('[role=status]').textContent = 'Vista previa de exportación en ' + format + '.';
      });
      root.querySelector('.cs-logout').addEventListener('click', () => {
        root.querySelector('.cs-session [role=status]').textContent = 'Estás en una vista previa.';
      });
      selectLayer('segmentation');
    })();
  </script>
