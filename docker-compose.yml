name: clearsight

x-backend-environment: &backend-environment
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-clearsight}
  POSTGRES_USER: ${POSTGRES_USER:-clearsight}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clearsight}
  REDIS_URL: redis://redis:6379/0
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MINIO_ENDPOINT: minio
  MINIO_PORT: "9000"
  MINIO_BROWSER_ORIGIN: ${MINIO_BROWSER_ORIGIN:-http://localhost:9000}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
  MINIO_SECURE: "false"
  STORAGE_PROVIDER: ${STORAGE_PROVIDER:-minio}
  STORAGE_ID: ${STORAGE_ID:-}
  STORAGE_DOWNLOAD_TTL_SECONDS: ${STORAGE_DOWNLOAD_TTL_SECONDS:-3600}
  AZURE_STORAGE_ACCOUNT_URL: ${AZURE_STORAGE_ACCOUNT_URL:-}
  AZURE_STORAGE_ACCOUNT_NAME: ${AZURE_STORAGE_ACCOUNT_NAME:-}
  AZURE_STORAGE_ACCOUNT_KEY: ${AZURE_STORAGE_ACCOUNT_KEY:-}
  JWT_SECRET: ${JWT_SECRET:-replace-me}
  AUTH_PUBLIC_ORIGIN: ${AUTH_PUBLIC_ORIGIN:-http://localhost:3000}
  # HMAC secret used to pseudonymize doctor ids in gold-standard exports.
  EXPORT_HMAC_SECRET: ${EXPORT_HMAC_SECRET:-replace-me-too}
  DATABASE_URL: postgresql://${POSTGRES_USER:-clearsight}:${POSTGRES_PASSWORD:-clearsight}@postgres:5432/${POSTGRES_DB:-clearsight}
  ML_SERVICE_URL: http://ml-service:8000
  ML_API_TOKEN: ${ML_API_TOKEN:-}
  ML_PUBLIC_HOST: minio:9000
  CORS_ORIGIN: ${CORS_ORIGIN:-*}

services:

  migrate:
    build:
      context: .
      dockerfile: docker/migrate.Dockerfile
    restart: "no"
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - clearsight
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clearsight}
      POSTGRES_USER: ${POSTGRES_USER:-clearsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clearsight}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-clearsight} -d ${POSTGRES_DB:-clearsight}
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clearsight

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clearsight

  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      MC_HOST_health: http://${MINIO_ACCESS_KEY:-minioadmin}:${MINIO_SECRET_KEY:-minioadmin}@127.0.0.1:9000
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test:
        - CMD
        - mc
        - ping
        - --exit
        - health
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clearsight

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    restart: unless-stopped
    command: >
      sh -c "pip install --no-cache-dir psycopg2-binary boto3 &&
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql+psycopg2://${POSTGRES_USER:-clearsight}:${POSTGRES_PASSWORD:-clearsight}@postgres:5432/${POSTGRES_DB:-clearsight}
      --artifacts-destination s3://mlflow/
      --serve-artifacts"
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - mlflow-data:/mlflow
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - clearsight

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    environment: *backend-environment
    ports:
      - "8080:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mlflow:
        condition: service_started
    volumes:
      - backend-data:/app/data
    networks:
      - clearsight

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    restart: unless-stopped
    command: npm run worker
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mlflow:
        condition: service_started
    volumes:
      - worker-data:/app/data
    networks:
      - clearsight

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started
    networks:
      - clearsight

volumes:
  postgres-data:
  redis-data:
  minio-data:
  mlflow-data:
  backend-data:
  worker-data:

networks:
  clearsight:
    external: true
    name: clearsight
